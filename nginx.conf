# HTTP to HTTPS redirect
server {
    listen 80;
    server_name websockets.encryptedbar.com www.websockets.encryptedbar.com;
    return 301 https://$host$request_uri;
}

# WebSocket server for websockets.encryptedbar.com
server {
    listen 443 ssl;
    server_name websockets.encryptedbar.com www.websockets.encryptedbar.com;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/websockets.encryptedbar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websockets.encryptedbar.com/privkey.pem;

    # WebSocket endpoint
    location /ws/ {
        proxy_pass http://fastapi:8001;
        proxy_http_version 1.1;
        
        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API endpoints
    location / {
        proxy_pass http://fastapi:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

